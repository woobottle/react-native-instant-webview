buildscript {
    ext.safeExtGet = {prop, fallback ->
        rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

def isNewArchitectureEnabled() {
    return rootProject.hasProperty("newArchEnabled") && rootProject.getProperty("newArchEnabled") == "true"
}

// New Architecture: apply the React Native Gradle plugin so codegen generates
// NativeInstantWebViewSpec (a TurboModule base class) from src/NativeInstantWebView.ts.
// Without this the spec is never generated and InstantWebViewModule fails to compile.
if (isNewArchitectureEnabled()) {
    apply plugin: 'com.facebook.react'
}

android {
    namespace "com.instantwebview"
    compileSdkVersion safeExtGet('compileSdkVersion', 34)

    defaultConfig {
        minSdkVersion safeExtGet('minSdkVersion', 21)
        targetSdkVersion safeExtGet('targetSdkVersion', 34)
        buildConfigField "boolean", "IS_NEW_ARCHITECTURE_ENABLED", isNewArchitectureEnabled().toString()
    }

    buildFeatures {
        buildConfig true
    }

    sourceSets {
        main {
            java.srcDirs = ['src/main/java']
            // Old arch: use the hand-written NativeInstantWebViewSpec.
            // New arch: the same-named spec is produced by codegen (above) and
            // added to the compile classpath automatically — no source dir needed.
            if (!isNewArchitectureEnabled()) {
                java.srcDirs += 'src/oldarch/java'
            }
        }
    }
}

dependencies {
    implementation "com.facebook.react:react-native:+"
}
